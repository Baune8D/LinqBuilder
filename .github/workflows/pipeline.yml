name: Pipeline

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch: # started by dependabot-lock-files.yml

env:
  DOTNET_VERSION: '10.0.x'

jobs:

  pipeline:
    # Dependabot's NuGet PRs are built by dependabot-lock-files.yml after it fixes their lock files
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'dependabot[bot]' ||
      !startsWith(github.head_ref, 'dependabot/nuget/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # NuGet trusted publishing
      statuses: write # report runs started by dependabot-lock-files.yml
    steps:
      # GitHub doesn't show workflow_dispatch runs on pull requests, so runs
      # started by dependabot-lock-files.yml report a commit status instead
      - name: Report pending status
        if: github.event_name == 'workflow_dispatch'
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=pipeline -f target_url="$RUN_URL"
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      # Trusted publishing: exchanges the job's OIDC token for an API key
      # that is valid for 1 hour. PushNuGet only runs on tags.
      - name: NuGet login
        id: nuget-login
        if: startsWith(github.ref, 'refs/tags/v')
        uses: NuGet/login@v1
        with:
          user: Baune8D
      - name: Execute NUKE
        run: ./build.cmd UploadCodecov PushNuGet PushMyGet
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          MYGET_API_KEY: ${{ secrets.MYGET_API_KEY }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      - name: Report status
        if: always() && github.event_name == 'workflow_dispatch'
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$STATE" -f context=pipeline -f target_url="$RUN_URL"
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
